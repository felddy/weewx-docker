---
name: Build

on:  # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - develop
      - develop-*
  release:
    types:
      - published
  schedule:
    # Weekly image refresh (updates the edge tag). Daily CVE monitoring is
    # handled by _rescan.yml against the attested SBOMs; floating-tag
    # reconciliation after release edits is handled by _retag.yml.
    - cron: 0 10 * * 1  # Mondays at 10am
  workflow_dispatch:
    inputs:
      image-tag:
        description: Tag to apply to pushed images
        required: true
        default: dispatch

concurrency:
  # Key the group on the fully-qualified ref so each event type gets its own
  # lane: pushes use `refs/heads/<branch>`, pull requests use
  # `refs/pull/<n>/merge`, and the merge queue uses its own ref. Because those
  # namespaces never overlap, a pull_request run can no longer cancel the push
  # run for the same branch (and vice versa). That cross-event cancellation
  # left a cancelled `CI Gate` status check on the head commit, which branch
  # protection treated as a failing required check and refused to merge.
  # cancel-in-progress still supersedes older runs *within* a ref (a new push
  # or a new PR sync), which is safe because required checks are only
  # evaluated against the latest commit SHA.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant write scopes per job; a workflow-level grant would hand every
# job (lint, diagnostics, config) a write-capable token it never needs.
permissions: {}

jobs:
  diagnostics:
    name: Diagnostics
    permissions:
      contents: read
    uses: felddy/reusable-workflows/.github/workflows/diagnostics.yml@f6750a7ef87d15f11ecae4c0ef3784daceb83d5d  # tag=v5.0.0-rc2

  config:
    name: Config
    permissions:
      contents: read
    uses: felddy/reusable-workflows/.github/workflows/project-config.yml@f6750a7ef87d15f11ecae4c0ef3784daceb83d5d  # tag=v5.0.0-rc2
    with:
      version-file: src/version.txt
      image-name: felddy/weewx
      platforms: >-
        ["linux/amd64","linux/arm/v6","linux/arm/v7","linux/arm64",
        "linux/ppc64le","linux/riscv64","linux/s390x"]
      test-platforms: '["linux/amd64"]'

  lint:
    name: Lint
    permissions:
      contents: read
    uses: felddy/reusable-workflows/.github/workflows/common-lint.yml@f6750a7ef87d15f11ecae4c0ef3784daceb83d5d  # tag=v5.0.0-rc2

  pipeline:
    name: Pipeline
    needs:
      - diagnostics
      - config
      - lint
    permissions:
      actions: read
      # contents: write lets the pipeline record image digests in release
      # notes; every other pipeline job narrows back to contents: read.
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: felddy/reusable-workflows/.github/workflows/container-pipeline.yml@f6750a7ef87d15f11ecae4c0ef3784daceb83d5d  # tag=v5.0.0-rc2
    with:
      image-name: ${{ needs.config.outputs.image-name }}
      platforms: ${{ needs.config.outputs.platforms }}
      test-platforms: ${{ needs.config.outputs.test-platforms }}
      scan-severity: CRITICAL,HIGH
      build-args: ${{ needs.config.outputs.build-args }}
      mirror-on-release: true
      publish-readme-on-release: true
    secrets:
      docker-hub-username: ${{ secrets.DOCKER_USERNAME }}
      docker-hub-password: ${{ secrets.DOCKER_PASSWORD }}

  ci-gate:
    name: CI Gate
    needs:
      - diagnostics
      - config
      - lint
      - pipeline
    # Run whether dependencies succeed, fail, or are skipped so the gate can
    # evaluate their results -- but NOT when the run itself is cancelled (for
    # example when superseded via `concurrency`). `always()` would execute
    # even during cancellation and report a spurious failure; `!cancelled()`
    # still runs when a dependency *fails* (failure is not cancellation), so
    # genuine failures are caught while cancelled runs simply skip the gate.
    if: ${{ !cancelled() }}
    permissions: {}
    uses: felddy/reusable-workflows/.github/workflows/ci-gate.yml@f6750a7ef87d15f11ecae4c0ef3784daceb83d5d  # tag=v5.0.0-rc2
    with:
      needs-json: ${{ toJSON(needs) }}
