---
name: Rescan

# Daily CVE monitoring of the published images: scans the attested SBOMs of
# the floating tags without rebuilding or pulling images. The weekly Build
# workflow refreshes the images themselves.

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: 0 10 * * *  # everyday at 10am
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  rescan:
    name: Rescan Container
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: felddy/reusable-workflows/.github/workflows/container-rescan.yml@c37b510076afebbca32009d7869267ae3e0b62e6  # tag=v5.0.0
    with:
      image-name: felddy/weewx
      tags: '["latest","edge"]'
