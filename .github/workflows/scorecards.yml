---
name: Scorecards supply-chain security

# Trigger-only stub: the dual-trigger scorecards workflow in
# felddy/reusable-workflows does the work. Pinned to an exact commit
# for the Phase E pilot; moves to @v5 with the full stub conversion.

on: # yamllint disable-line rule:truthy
  # Only the default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: 43 4 * * 4
  push:
    branches:
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    uses: felddy/reusable-workflows/.github/workflows/scorecards.yml@483fb4043c236b58b151d097a43cf3c6cf11a594
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Used to receive a badge.
      id-token: write
      contents: read
      actions: read
