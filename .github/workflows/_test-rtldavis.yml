---
name: Test rtldavis container

permissions: {}

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      image-name:
        description: Container image name without registry
        required: true
        type: string

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # tag=v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve amd64 image digest
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          ARTIFACT_NAME="digests-${IMAGE_SLUG}-linux-amd64"
          ARTIFACT_DIR="/tmp/digests/${ARTIFACT_NAME}"

          mkdir -p "${ARTIFACT_DIR}"

          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${ARTIFACT_DIR}"

          HEX=$(find "${ARTIFACT_DIR}" -maxdepth 1 -type f \
            -printf '%f\n' | grep -E '^[a-f0-9]{64}$' | head -n1)

          if [[ -z "${HEX}" ]]; then
            echo "::error::No valid amd64 digest found."
            exit 1
          fi

          IMAGE_REF="ghcr.io/${IMAGE_NAME}@sha256:${HEX}"
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

          docker pull "${IMAGE_REF}"

      - name: Verify rtldavis image contents
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE_REF}" \
            -ec '
              command -v rtl_test
              command -v rtl_fm
              test ! -e /usr/local/bin/rtldavis
              /opt/venv/bin/python -c "import numpy, ctypes.util; assert ctypes.util.find_library(\"rtlsdr\")"

              test -f /opt/weewx-extensions/weewx-rtldavis/rtldavis.py
              test -f /opt/weewx-extensions/weewx-rtldavis/rtldavis_receiver.py
              test -f /opt/weewx-extensions/weewx-rtldavis/rtldavis_dsp.py
              test -f /opt/weewx-extensions/MQTTSubscribe/MQTTSubscribe.py
              test -f /opt/weewx-extensions/weewx-mqtt/mqtt.py
              test -d /opt/weewx-extensions/weewx-belchertown-new/new-belchertown

              test -x /usr/local/bin/start-weewx-rtldavis-overlay
            '

      - name: Verify driver version and extensions
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          EXPECTED_VERSION="$(sed -n 's/^ARG RTL_DAVIS_REF=v//p' Dockerfile.rtldavis)"
          test -n "${EXPECTED_VERSION}"

          docker run --rm \
            --entrypoint /bin/bash \
            -e EXPECTED_VERSION="${EXPECTED_VERSION}" \
            "${IMAGE_REF}" \
            -ec '
              /opt/venv/bin/python - <<'"'"'PY'"'"'
          import ast
          import os
          from pathlib import Path

          driver = Path(
              "/opt/weewx-extensions/weewx-rtldavis/rtldavis.py"
          ).read_text()

          tree = ast.parse(driver)
          versions = [
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(t, ast.Name) and t.id == "DRIVER_VERSION"
                  for t in node.targets
              )
              and isinstance(node.value, ast.Constant)
          ]

          expected = os.environ["EXPECTED_VERSION"]
          assert versions == [expected], (versions, expected)
          assert "stn_dict.get(" in driver and "hardware_name" in driver
          assert "return self._hardware_name" in driver

          skin = Path(
              "/opt/weewx-extensions/weewx-belchertown-new/"
              "new-belchertown/skin.conf"
          )
          extension = Path(
              "/opt/weewx-extensions/weewx-belchertown-new/"
              "bin/user/new_belchertown.py"
          )

          assert skin.is_file()
          assert extension.is_file()
          assert "pirateweather" in extension.read_text().lower()
          print("Driver and extension checks passed")
          PY
            '

      - name: Verify startup sync and charts preservation
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          TEST_DATA=$(mktemp -d)
          trap 'sudo rm -rf "${TEST_DATA}"' EXIT

          mkdir -p "${TEST_DATA}/skins/new-belchertown"

          cat > "${TEST_DATA}/skins/new-belchertown/charts.conf" <<'CHARTS'
          # CUSTOM TEST CHARTS FILE
          [test_marker]
              value = preserve_me
          CHARTS

          docker run --rm \
            --entrypoint /usr/local/bin/start-weewx-rtldavis-overlay \
            -v "${TEST_DATA}:/data" \
            "${IMAGE_REF}" \
            >/tmp/rtldavis-startup.log 2>&1 || {
              echo "Overlay exited; checking synchronization results."
            }

          grep -q "Installing/updating Belchertown New Python extension" \
            /tmp/rtldavis-startup.log

          test -f "${TEST_DATA}/bin/user/rtldavis.py"
          test -f "${TEST_DATA}/bin/user/rtldavis_receiver.py"
          test -f "${TEST_DATA}/bin/user/rtldavis_dsp.py"
          test -f "${TEST_DATA}/bin/user/MQTTSubscribe.py"
          test -f "${TEST_DATA}/bin/user/mqtt.py"
          test -d "${TEST_DATA}/skins/new-belchertown"

          grep -q "CUSTOM TEST CHARTS FILE" \
            "${TEST_DATA}/skins/new-belchertown/charts.conf"
          grep -q "preserve_me" \
            "${TEST_DATA}/skins/new-belchertown/charts.conf"
