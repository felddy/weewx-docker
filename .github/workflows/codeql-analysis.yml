---
name: CodeQL

# Trigger-only stub: the dual-trigger codeql-analysis workflow in
# felddy/reusable-workflows does the work.

on:
  push:
    branches: [develop]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - develop
  schedule:
    - cron: '31 7 * * 2'

permissions: {}

jobs:
  codeql:
    uses: felddy/reusable-workflows/.github/workflows/codeql-analysis.yml@v5
    with:
      languages: '["python"]'
    permissions:
      contents: read
      security-events: write
