[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
authors = [{ name = "Mark Feldhousen", email = "markf@geekpad.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["ephem", "pyserial", "pyusb", "setuptools", "weewx == 5.3.0"]
description = "Containerized WeeWX"
dynamic = ["version"]
keywords = ["container", "docker", "weewx"]
license = { file = "LICENSE" }
name = "weewx-docker"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
homepage = "https://github.com/felddy"
issues = "https://github.com/felddy/weewx-docker/issues"
source = "https://github.com/felddy/weewx-docker"

[dependency-groups]
test = [
    "coverage",
    "coveralls",
    "docker",
    "pre-commit",
    "pytest",
    "pytest-cov",
]
dev = ["ipython", "mypy", "semver", { include-group = "test" }]

[tool.pytest.ini_options]
addopts = "--capture=no --color=yes --runslow --verbose -rA"
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools]
# This project is a dependency-only meta-package: it pins weewx and its runtime
# dependencies but ships no importable modules of its own. Declare that
# explicitly so the build backend does not attempt package auto-discovery.
py-modules = []

[tool.setuptools.dynamic]
version = { file = "src/version.txt" }
