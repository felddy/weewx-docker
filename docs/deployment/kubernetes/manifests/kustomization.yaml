---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # Hash-suffixed generated ConfigMaps: editing weewx.conf or
  # requirements.txt changes the generated name, which rolls the pod.
  # Provide your own weewx.conf in this directory before applying — see
  # the guide.
  - name: weewx-config
    namespace: weewx
    files:
      - weewx.conf
  - name: weewx-extensions
    namespace: weewx
    files:
      - requirements.txt
resources:
  - deployment.yaml
  - namespace.yaml
  - pvc.yaml
  - secret.yaml
