---
# Values for the ${WEEWX_*} tokens in weewx.conf, one entry per token.
# For example, with `password = ${WEEWX_WU_PASSWORD}` in weewx.conf, add:
#
#   WEEWX_WU_PASSWORD: the-real-password
#
# A config with no tokens needs no entries, but the Secret itself must
# exist.  Consider a secrets manager (SOPS, Sealed Secrets, external
# secrets operators) instead of committing real values to version control.
apiVersion: v1
kind: Secret
metadata:
  name: weewx-secrets
  namespace: weewx
stringData:
  WEEWX_EXAMPLE_TOKEN: replace_me
